[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finflow"
version = "1.0.0"
description = "FinFlow - enterprise financial data engineering pipeline (ETL/ELT) for MySQL, Azure and Snowflake"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<4",
    "numpy>=1.26",
    "SQLAlchemy>=2.0,<2.1",
    "PyMySQL>=1.1",
    "cryptography>=42",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
cloud = [
    "azure-storage-blob>=12.19",
    "azure-identity>=1.16",
    "azure-keyvault-secrets>=4.8",
    "snowflake-connector-python[pandas]>=3.7",
]

[project.scripts]
finflow = "finflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E731"]   # long SQL/strings are intentional; short lambdas are fine

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["mysql: integration tests that need a live MySQL 8.0 (set FINFLOW_TEST_MYSQL_URL)"]
